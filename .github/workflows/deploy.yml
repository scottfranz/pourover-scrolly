# Fetch the Google Sheet, run the strict build, publish to GitHub Pages.
# If the build fails, nothing is deployed: the last good version stays live and GitHub emails you.
name: Build and deploy

on:
  schedule:
    - cron: '37 8 1 * *' # 1st of each month, 08:37 UTC
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for an update on demand

permissions:
  contents: write # commit the refreshed data (also keeps the monthly schedule from being auto-disabled)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch sheet
        run: npm run fetch
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
      - name: Build data (strict)
        run: npm run build:data
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
      - name: Assemble site
        run: |
          mkdir -p _site/data/build
          cp index.html story.js _site/
          cp data/build/bags.json data/build/facts.json _site/data/build/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
